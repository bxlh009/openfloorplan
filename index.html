<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>户型设计师</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css?v=0.4.1-2">
</head>
<body>
<header class="topbar">
  <div class="brand" data-i18n="app.brand">户型设计师</div>
  <nav class="modes">
    <button class="mode active" data-mode="2d" data-i18n="mode.2d">2D 平面</button>
    <button class="mode" data-mode="3d" data-i18n="mode.3d">3D 预览</button>
    <button class="mode" data-mode="split" data-i18n="mode.split">分屏</button>
  </nav>
  <div class="actions">
    <button id="btn-new" data-i18n="action.new">新建</button>
    <button id="btn-save" data-i18n="action.save">保存</button>
    <button id="btn-load" data-i18n="action.load">载入</button>
    <button id="btn-export" data-i18n="action.exportSvg">导出 SVG</button>
    <button id="btn-lang" type="button">EN</button>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <section class="panel">
      <h3 data-i18n="section.drawing">绘图</h3>
      <div class="tool-grid">
        <button class="tool" data-tool="select" data-i18n-title="tool.select" title="选择 (V)"><span class="ico">↖</span><span data-i18n="tool.select">选择</span></button>
        <button class="tool" data-tool="wall" data-i18n-title="tool.wall" title="画墙 (W)"><span class="ico">▬</span><span data-i18n="tool.wall">墙体</span></button>
        <button class="tool" data-tool="door" data-i18n-title="tool.door" title="门 (D)"><span class="ico">🚪</span><span data-i18n="tool.door">门</span></button>
        <button class="tool" data-tool="window" data-i18n-title="tool.window" title="窗 (F)"><span class="ico">▭</span><span data-i18n="tool.window">窗</span></button>
        <button class="tool" data-tool="room" data-i18n-title="tool.room" title="房间 (R)"><span class="ico">▣</span><span data-i18n="tool.room">房间</span></button>
        <button class="tool" data-tool="dimension" data-i18n-title="tool.dimension" title="标注 (M)"><span class="ico">↔</span><span data-i18n="tool.dimension">标注</span></button>
      </div>
    </section>

    <section class="panel">
      <h3 data-i18n="section.styles">装修风格</h3>
      <div class="style-grid" id="style-grid">
        <button class="style-card active" data-style="modern" aria-pressed="true"><span class="style-swatch" style="--style-wall:#f4f1ec;--style-floor:#c8a47b"></span><span data-i18n="style.modern">现代</span></button>
        <button class="style-card" data-style="nordic" aria-pressed="false"><span class="style-swatch" style="--style-wall:#fbfbf7;--style-floor:#e1c9a8"></span><span data-i18n="style.nordic">北欧</span></button>
        <button class="style-card" data-style="japanese" aria-pressed="false"><span class="style-swatch" style="--style-wall:#eee7d8;--style-floor:#b89b72"></span><span data-i18n="style.japanese">日式</span></button>
        <button class="style-card" data-style="wabiSabi" aria-pressed="false"><span class="style-swatch" style="--style-wall:#d8cdbc;--style-floor:#a68b6b"></span><span data-i18n="style.wabiSabi">侘寂</span></button>
        <button class="style-card" data-style="industrial" aria-pressed="false"><span class="style-swatch" style="--style-wall:#a9aaa7;--style-floor:#6f6b65"></span><span data-i18n="style.industrial">工业</span></button>
        <button class="style-card" data-style="american" aria-pressed="false"><span class="style-swatch" style="--style-wall:#eadfce;--style-floor:#7a5136"></span><span data-i18n="style.american">美式</span></button>
      </div>
    </section>

    <section class="panel">
      <h3 data-i18n="section.architecture">建筑构件风格</h3>
      <div class="style-grid architecture-grid" id="architecture-grid">
        <button class="style-card active" data-architecture="modern" aria-pressed="true"><span class="architecture-swatch architecture-modern"></span><span data-i18n="style.modern">现代</span></button>
        <button class="style-card" data-architecture="nordic" aria-pressed="false"><span class="architecture-swatch architecture-nordic"></span><span data-i18n="style.nordic">北欧</span></button>
        <button class="style-card" data-architecture="japanese" aria-pressed="false"><span class="architecture-swatch architecture-japanese"></span><span data-i18n="style.japanese">日式</span></button>
        <button class="style-card" data-architecture="wabiSabi" aria-pressed="false"><span class="architecture-swatch architecture-wabi"></span><span data-i18n="style.wabiSabi">侘寂</span></button>
        <button class="style-card" data-architecture="industrial" aria-pressed="false"><span class="architecture-swatch architecture-industrial"></span><span data-i18n="style.industrial">工业</span></button>
        <button class="style-card" data-architecture="american" aria-pressed="false"><span class="architecture-swatch architecture-american"></span><span data-i18n="style.american">美式</span></button>
      </div>
    </section>

    <section class="panel">
      <h3 data-i18n="section.furniture">家具</h3>
      <div class="tool-grid">
        <button class="tool" data-furniture="sofa"><span>🛋</span> <span data-i18n="furniture.sofa">沙发</span></button>
        <button class="tool" data-furniture="bed"><span>🛏</span> <span data-i18n="furniture.bed">床</span></button>
        <button class="tool" data-furniture="table"><span>🍽</span> <span data-i18n="furniture.table">餐桌</span></button>
        <button class="tool" data-furniture="wardrobe"><span>🗄</span> <span data-i18n="furniture.wardrobe">衣柜</span></button>
        <button class="tool" data-furniture="desk"><span>🪑</span> <span data-i18n="furniture.desk">书桌</span></button>
        <button class="tool" data-furniture="cabinet"><span>🗄</span> <span data-i18n="furniture.cabinet">橱柜</span></button>
        <button class="tool" data-furniture="plant"><span>🪴</span> <span data-i18n="furniture.plant">盆栽</span></button>
        <button class="tool" data-furniture="lamp"><span>💡</span> <span data-i18n="furniture.lamp">落地灯</span></button>
        <button class="tool" data-furniture="toilet"><span>🚽</span> <span data-i18n="furniture.toilet">马桶</span></button>
        <button class="tool" data-furniture="bathtub"><span>🛁</span> <span data-i18n="furniture.bathtub">浴缸</span></button>
        <button class="tool" data-furniture="sink"><span>🚰</span> <span data-i18n="furniture.sink">水槽</span></button>
        <button class="tool" data-furniture="stove"><span>🔥</span> <span data-i18n="furniture.stove">灶台</span></button>
        <button class="tool" data-furniture="fridge"><span>🧊</span> <span data-i18n="furniture.fridge">冰箱</span></button>
        <button class="tool" data-furniture="washer"><span>🌀</span> <span data-i18n="furniture.washer">洗衣机</span></button>
        <button class="tool" data-furniture="tv"><span>📺</span> <span data-i18n="furniture.tv">电视</span></button>
      </div>
    </section>

    <section class="panel">
      <h3 data-i18n="section.properties">属性</h3>
      <div id="props" class="props">
        <p class="hint" data-i18n="hint.selectObject">选择对象查看属性</p>
      </div>
    </section>
  </aside>

  <section class="canvas-wrap">
    <div class="views">
      <div class="view" id="view-2d">
        <canvas id="canvas-2d"></canvas>
      </div>
      <div class="split-divider" id="split-divider"></div>
      <div class="view hidden" id="view-3d">
        <div id="canvas-3d"></div>
      </div>
    </div>
    <footer class="statusbar">
      <span id="status-tool">工具: 选择</span>
      <span id="status-pos">X: 0 Y: 0</span>
      <span id="status-zoom">缩放: 100%</span>
      <span id="status-info"></span>
    </footer>
  </section>
</main>

<input type="file" id="file-load" accept=".json" style="display:none">

<script src="js/vendor/three.min.js"></script>
<script src="js/project.js?v=0.4.1-2"></script>
<script src="js/i18n.js?v=0.4.1-2"></script>
<script src="js/state.js?v=0.4.1-2"></script>
<script src="js/draw2d.js?v=0.4.1-2"></script>
<script src="js/view3d.js?v=0.4.1-2"></script>
<script src="js/tools.js?v=0.4.1-2"></script>
<script src="js/ui.js?v=0.4.1-2"></script>
<script src="js/app.js?v=0.4.1-2"></script>
</body>
</html>
